name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    # Only rebuild when the app or the scan changes — the build re-fetches the
    # ~150MB scan from Git LFS every run, so skip it for docs/SQL-only commits.
    paths:
      - 'viewer/**'
      - 'lcc-result/**'
      - 'mesh-files/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # data.bin lives in Git LFS; fetch it so the build bundles the real
          # scan, not the LFS pointer file.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build viewer (bundles the scan via vite plugin)
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

      - id: deployment
        uses: actions/deploy-pages@v4
